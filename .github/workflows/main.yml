name: Unzip and Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip Bp.zip
        # Auto-detect if files are inside a subfolder and move them out
        SUBFOLDER=$(find . -maxdepth 2 -name "build.gradle" -exec dirname {} \;)
        if [ "$SUBFOLDER" != "." ] && [ -n "$SUBFOLDER" ]; then
          echo "Found project files in subfolder: $SUBFOLDER"
          mv $SUBFOLDER/* . 2>/dev/null || true
          mv $SUBFOLDER/.* . 2>/dev/null || true
        fi

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Compiled Jar
      uses: actions/upload-artifact@v4
      with:
        name: compiled-mod
        path: build/libs/*.jar
        
